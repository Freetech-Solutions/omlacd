[pytest]
# Configuración de pytest para el proyecto ACD
testpaths = source/tests_unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=source/ari-app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=0
markers =
    unit: Tests unitarios
    integration: Tests de integración
    slow: Tests que tardan mucho tiempo


include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: '$FULL == "true"'
  - project: 'omnileads/devsecops'
    ref: 'main'
    file:
      - 'templates/security-scans.yml'
      - 'templates/gitleaks.yml'
      - 'templates/owasp-dependency-check.yml'
      - 'templates/sonarqube.yml'

variables:
  IMAGE_NAME: "acd"
  # Valores válidos: omnileads | freetechsolutions. Vacío = según rama (master-2.0 → omnileads).
  DOCKER_ORG: ""
  FULL: ""
  BUILD: ""
  # SKIP_OWASP=true → omite owasp_dependency_scan y owasp_defectdojo_upload (útil con FULL=true).
  SKIP_OWASP: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  TRIVY_SEVERITY: "CRITICAL"
  # DefectDojo: nombre del Product (Asset) en DefectDojo.
  # Para la estrategia "1 Repo = 1 Producto", mantén vacía la variable DEFECTDOJO_ENGAGEMENT_ID en GitLab
  # y este script creará/resolverá el producto y el engagement "Continuous Security" automáticamente.
  DEFECTDOJO_PRODUCT_NAME: "OMniACD"
  OWASP_PROJECT_NAME: "OMniACD"
  # DefectDojo con certificado interno/auto-firmado (override en CI/CD si usan CA pública).
  DEFECTDOJO_INSECURE: "true"
  # Sin variables → sonarqube, build, security_scan y security_report (+ gitleaks/owasp en security).
  # BUILD=true → solo build (container-image-dev).
  # FULL=true → pipeline completo: SAST, gitleaks, owasp, sonarqube, build y escaneos de seguridad.
  # FULL=true + SKIP_OWASP=true → igual que FULL, sin OWASP.

stages:
  - security
  - test
  - sonarqube
  - build
  - security_scan
  - security_report

.sonar-rules: &sonar-rules
  rules:
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0")'

.build-rules: &build-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0")'

# Las reglas de Trivy se heredan por defecto de la plantilla central

.gitleaks-rules: &gitleaks-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH =~ /^master-.*$/)'

.owasp-rules: &owasp-rules
  rules:
    - if: '$SKIP_OWASP == "true"'
      when: never
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH =~ /^master-.*$/)'

# Job SonarQube centralizado en omnileads/devsecops (templates/sonarqube.yml).
sonarqube_scan:
  stage: sonarqube
  <<: *sonar-rules

sonarqube_defectdojo_upload:
  <<: *sonar-rules

.build_template:
  image: docker:20.10.15-alpine3.15
  services:
    - docker:20.10.15-dind-alpine3.15
  before_script:
    - apk add --no-cache docker-cli-buildx
  script:
    - echo "Building ${IMAGE_NAME}..."
    - ls -l ${DOCKERFILE_PATH}
    - docker buildx build --file=${DOCKERFILE_PATH} --tag=${IMAGE_NAME} --target=run --load ${BUILD_CONTEXT}
    - docker save ${IMAGE_NAME} -o ${CI_PROJECT_DIR}/${IMAGE_NAME}.tar
    - |-
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Pipeline de Merge Request: omitiendo login y push a Docker Hub."
      elif [ -z "${DOCKER_PASSWORD:-}" ] && [ -z "${DOCKER_SECRET:-}" ]; then
        echo "Credenciales de Docker no configuradas: omitiendo login y push."
      else
        if [ -z "${IMAGE_VERSION}" ]; then
          IMAGE_VERSION="$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}"
        fi

        echo "Pushing image ${IMAGE_NAME}..."

        if [ -n "${DOCKER_ORG}" ]; then
          if [[ "${DOCKER_ORG}" != "omnileads" && "${DOCKER_ORG}" != "freetechsolutions" ]]; then
            echo "Error: DOCKER_ORG debe ser 'omnileads' o 'freetechsolutions'."
            exit 1
          fi
          PUSH_ORG="${DOCKER_ORG}"
        elif [[ "${CI_COMMIT_BRANCH}" == "master-2.0" ]]; then
          PUSH_ORG="omnileads"
        else
          PUSH_ORG="freetechsolutions"
        fi

        if [[ "${PUSH_ORG}" == "omnileads" ]]; then
          if [ -z "${DOCKER_SECRET:-}" ] || [ -z "${DOCKER_USERNAME:-}" ]; then
            echo "Faltan credenciales para org omnileads: omitiendo push."
          else
            echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
            docker tag ${IMAGE_NAME} docker.io/${PUSH_ORG}/${IMAGE_NAME}:$IMAGE_VERSION
            docker push docker.io/${PUSH_ORG}/${IMAGE_NAME}:$IMAGE_VERSION
          fi
        else
          if [ -z "${DOCKER_PASSWORD:-}" ] || [ -z "${DOCKER_USER:-}" ]; then
            echo "Faltan credenciales para org freetechsolutions: omitiendo push."
          else
            echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin
            docker tag ${IMAGE_NAME} docker.io/${PUSH_ORG}/${IMAGE_NAME}:$IMAGE_VERSION
            docker push docker.io/${PUSH_ORG}/${IMAGE_NAME}:$IMAGE_VERSION
          fi
        fi
      fi
  <<: *build-rules

container-image-dev:
  extends: .build_template
  stage: build
  variables:
    IMAGE_NAME: acd
    DOCKERFILE_PATH: Dockerfile
    BUILD_CONTEXT: .
  artifacts:
    paths:
      - acd.tar
    expire_in: 90 days

# Los jobs trivy_scan, defectdojo_upload, owasp_defectdojo_upload y sonarqube_defectdojo_upload se heredan de devsecops.

# GitLab no expande ${GITLEAKS_STAGE} del template incluido en el campo stage.
gitleaks_scan:
  stage: security
  <<: *gitleaks-rules

# GitLab no expande ${OWASP_SCAN_STAGE} del template incluido en el campo stage.
owasp_dependency_scan:
  stage: security
  <<: *owasp-rules

owasp_defectdojo_upload:
  <<: *owasp-rules

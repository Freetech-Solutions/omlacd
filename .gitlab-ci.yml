stages:
  - lint
  - test
  - build

variables:
  PYTHON_VERSION: "3.11"

.quality-rules: &quality-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

lint:flake8:
  image: python:${PYTHON_VERSION}-slim
  stage: lint
  before_script:
    - pip install --no-cache-dir --upgrade pip
    - pip install --no-cache-dir flake8
  script:
    - echo "Ejecutando flake8 en el código Python..."
    - flake8 source/ari-app/ --config=.flake8 --statistics --count
  <<: *quality-rules
  allow_failure: false

test:pytest:
  image: python:${PYTHON_VERSION}-slim
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir --upgrade pip
    - pip install --no-cache-dir -r build/requirements.txt
  script:
    - echo "Ejecutando tests unitarios..."
    - export PYTHONPATH="${CI_PROJECT_DIR}/source/ari-app:${PYTHONPATH}"
    - pytest --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - report.xml
    expire_in: 1 week
  <<: *quality-rules
  allow_failure: false

container-image-dev:
  services:
    - docker:20.10.15-dind-alpine3.15
  image: docker:20.10.15-alpine3.15
  stage: build
  before_script:
    - apk add --no-cache docker-cli-buildx
  script:
    - >-
      docker buildx build
      --file=Dockerfile
      --tag=run
      --target=run
      .
    - |-
      if [ "${CI_COMMIT_BRANCH}" == "master-2.0" ]; then
        echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        IMAGE_VERSION="$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}"
        docker tag run omnileads/acd:$IMAGE_VERSION
        docker push docker.io/omnileads/acd:$IMAGE_VERSION
      else
        echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin
        IMAGE_VERSION="$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}"
        docker tag run freetechsolutions/acd:$IMAGE_VERSION
        docker push docker.io/freetechsolutions/acd:$IMAGE_VERSION
      fi  
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /build/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_BUILD == "true"'
    - if: '$CI_PIPELINE_BUILD_ACD == "true"'

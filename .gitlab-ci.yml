stages:
  - build

container-image:
  services:
    - docker:20.10.15-dind-alpine3.15
  image: docker:20.10.15-alpine3.15
  stage: build
  before_script:
    - apk add --no-cache docker-cli-buildx
  script:
    - >-
      docker buildx build
      --file=Dockerfile
      --tag=dev
      --target=dev
      .
    - >-
      docker buildx build
      --file=Dockerfile
      --tag=run
      --target=run
      .
    - |-
      if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_SECRET}" ]; then
        echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        docker tag run omnileads/asterisk:latest
        docker tag run omnileads/asterisk:$CI_COMMIT_SHORT_SHA
        docker push docker.io/omnileads/asterisk:latest
        docker push docker.io/omnileads/asterisk:$CI_COMMIT_SHORT_SHA
      fi
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "oml-dev-2.0"
    - if: $CI_PIPELINE_SOURCE == "web"
  tags:
      - build

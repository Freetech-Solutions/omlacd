stages:
  - build

build-image:
  stage: build
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    # See https://github.com/docker-library/docker/pull/166
    DOCKER_TLS_CERTDIR: ""
  image: gitlab/dind
  script:
    - cd build/docker && bash build_image.sh
  only:
    - web
    - /.*release.*$/
    - /.*master.*$/

build-rpm:
  stage: build
  variables:
  image: freetechsolutions/fpm-ansible:centos7
  script:
    - cd build/rpm && bash build_rpm.sh
  only:
    - web
    - /.*release.*$/
    - /.*master.*$/

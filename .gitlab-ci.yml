include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: '$FULL == "true"'
  - project: 'omnileads/devsecops'
    ref: 'develop'
    file:
      - 'templates/security-scans.yml'
      - 'templates/gitleaks.yml'
      - 'templates/owasp-dependency-check.yml'
      - 'templates/sonarqube.yml'
      - 'templates/docker-build-push.yml'

variables:
  IMAGE_NAME: "acd"
  # Valores válidos: omnileads | freetechsolutions. Vacío = según rama (master-2.0 / master-3.0 → omnileads).
  DOCKER_ORG: ""
  FULL: ""
  BUILD: ""
  # ARM64=true → build/push multi-arch (amd64+arm64) vía devsecops docker-build-push.
  ARM64: ""
  # SKIP_OWASP=true → omite owasp_dependency_scan y owasp_defectdojo_upload (útil con FULL=true).
  SKIP_OWASP: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  TRIVY_SEVERITY: "CRITICAL"
  # DefectDojo: nombre del Product (Asset) en DefectDojo.
  # Para la estrategia "1 Repo = 1 Producto", mantén vacía la variable DEFECTDOJO_ENGAGEMENT_ID en GitLab
  # y este script creará/resolverá el producto y el engagement "Continuous Security" automáticamente.
  DEFECTDOJO_PRODUCT_NAME: "OMniACD"
  OWASP_PROJECT_NAME: "OMniACD"
  # SonarQube: solo código ARI; exclusiones default del template (OWASP HTML, htmlcov, .sonar).
  SONAR_PROJECT_KEY: "omnileads-acd"
  SONAR_PROJECT_NAME: "OMniLeads ACD"
  SONAR_SOURCES: "source/ari-app"
  # DefectDojo con certificado interno/auto-firmado (override en CI/CD si usan CA pública).
  DEFECTDOJO_INSECURE: "true"
  # Sin variables → sonarqube, build, security_scan y security_report (+ gitleaks/owasp en security).
  # BUILD=true → solo build (container-image-dev).
  # FULL=true → pipeline completo: SAST, gitleaks, owasp, sonarqube, build y escaneos de seguridad.
  # FULL=true + SKIP_OWASP=true → igual que FULL, sin OWASP.

stages:
  - security
  - test
  - sonarqube
  - build
  - security_scan
  - security_report

.sonar-rules: &sonar-rules
  rules:
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0")'

.build-rules: &build-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0")'

# Las reglas de Trivy se heredan por defecto de la plantilla central

.gitleaks-rules: &gitleaks-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'

.owasp-rules: &owasp-rules
  rules:
    - if: '$SKIP_OWASP == "true"'
      when: never
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-2.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'

# Job SonarQube centralizado en omnileads/devsecops (templates/sonarqube.yml).
# needs: [] (heredado del template): no bajar artifacts de OWASP/gitleaks al workspace de Sonar.
sonarqube_scan:
  stage: sonarqube
  needs: []
  <<: *sonar-rules

sonarqube_defectdojo_upload:
  <<: *sonar-rules

container-image-dev:
  extends: .docker_container_image
  stage: build
  variables:
    IMAGE_NAME: acd
    DOCKERFILE_PATH: Dockerfile
    BUILD_CONTEXT: .
    # Multi-arch: ARM64=true (devsecops). Requiere que ASTERISK_BASE_IMG sea manifest amd64+arm64.
    # Override base: DOCKER_BUILD_ARGS: "--build-arg ASTERISK_BASE_IMG=docker.io/.../asterisk:TAG"
  artifacts:
    paths:
      - acd.tar
    expire_in: 90 days

  <<: *build-rules
# Los jobs trivy_scan, defectdojo_upload, owasp_defectdojo_upload y sonarqube_defectdojo_upload se heredan de devsecops.

# GitLab no expande ${GITLEAKS_STAGE} del template incluido en el campo stage.
gitleaks_scan:
  stage: security
  <<: *gitleaks-rules

# Upload heredado de templates/gitleaks.yml; sin override ignora BUILD=true.
gitleaks_defectdojo_upload:
  <<: *gitleaks-rules

# GitLab no expande ${OWASP_SCAN_STAGE} del template incluido en el campo stage.
owasp_dependency_scan:
  stage: security
  <<: *owasp-rules

owasp_defectdojo_upload:
  <<: *owasp-rules

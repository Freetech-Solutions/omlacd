; Context for inbound calls (from external)
; Context for inbound calls (from external)
[oml-dial-in]
include => oml-dial-in-custom

exten => _.,1,Verbose(2, welcome OML inbound call channels)
same => n,Set(__OMLCODCLI=null)
same => n,Set(__OMLINBOUNDID=${EXTEN})
same => n,Set(__OMLVIDEO=${PJSIP_HEADER(read,OMLVIDEO)})

same => n,Gosub(sub-oml-set-chanvars,s,1(${EXTEN},INR))

same => n,GotoIf($["${OMLINRID}" != ""]?inrOk)
same => n,Playback(pbx-invalid)
same => n,Gosub(sub-oml-hangup,s,1(IN-R fail))

same => n(inrOk),Verbose(2, DID route OK)
same => n,Set(__OMLOUTNUM=${CALLERID(num)})
same => n,Set(CHANNEL(language)=${OMLINRLANG})

same => n(goDstSwitch),Gosub(sub-oml-dst-switch,s,1(${OMLINRDST}))
same => n,Gosub(sub-oml-hangup,s,1(IN-R fail))

same => n,Gosub(sub-oml-acd,s,1(inboundCall))
same => n,Gosub(sub-oml-hangup,s,1)

; Context for AMD invoke by dialout Stasis dialer calls
; Context for AMD invoke by dialout Stasis dialer calls
[amd]
exten => s,1,NoOp(AMD start ${CHANNEL(name)})
same => n,Gosub(sub-oml-set-chanvars,s,1(1,AMD_CONF))
same => n,GosubIf($["${ENV(AMD_SAMPLE_REC)}" = "1"]?amdRecStart)
same => n,Playback(silence/1)
same => n,AMD(${OMLAMD_CONFINITIAL_SILENCE},${OMLAMD_CONFGREETING},${OMLAMD_CONFAFTER_GREETING_SILENCE},${OMLAMD_CONFTOTAL_ANALYSIS_TIME},${OMLAMD_CONFMIN_WORD_LENGTH},${OMLAMD_CONFBETWEEN_WORDS_SILENCE},${OMLAMD_CONFMAXIMUM_NUMBER_OF_WORDS},${OMLAMD_CONFSILENCE_THRESHOLD},${OMLAMD_CONFMAXIMUM_WORD_LENGTH})
same => n,NoOp(Result: AMDSTATUS=${AMDSTATUS})
same => n,GosubIf($["${ENV(AMD_SAMPLE_REC)}" = "1"]?amdRecStop)
same => n,Stasis(${ENV(ASTERISK_APP)},amd_done,${AMDSTATUS},${AMDCAUSE})
same => n,Hangup()
same => n(amdRecStart),MixMonitor(/var/spool/asterisk/recording/amd/${CHANNEL(uniqueid)}-AMD.wav,i(AMD_MIXMON_ID))
same => n,Return()
same => n(amdRecStop),StopMixMonitor(${AMD_MIXMON_ID})
same => n,Return()

; Subrutina para verificar y setear variables de canal para llamadas entrantes
; Subrutina para verificar y setear variables de canal para llamadas entrantes
[sub-oml-in-check-set]
exten => s,1,Verbose(2, setting some channel variables)
same => n,Set(__OMLCAMPID=${ARG1})

; Subrutina para setear variables de canal a partir de REDIS (FastAGI)
; Subrutina para setear variables de canal a partir de REDIS (FastAGI)
[sub-oml-set-chanvars]
exten => s,1,Verbose(2, Set OML Channel Vars)
same => n,AGI(agi://${ENV(FASTAGI)}/omni-retrieve-conf,${ARG2},${ARG1})
same => n,Return()

; Subrutina para procesar llamadas Inbound a través del ACD Stasis
; Subrutina para procesar llamadas Inbound a través del ACD Stasis
[sub-oml-acd]
exten => s,1,Verbose(2, [ACD-MANAGER] Procesando canal para Stasis - Origen: ${ARG1})
same => n,Set(CHANNEL(language)=${LANG})
same => n(checkInbound),NoOp(Verificando Inbound)
same => n,GotoIf($["${ARG1}" != "inboundCall"]?launchStasis)
same => n,Verbose(2, [ACD-IN] Normalizando variables de Inbound)
same => n,ExecIf($["${OMLCAMPTYPE}" == ""]?Set(__OMLCAMPTYPE=3))
same => n,ExecIf($["${OMLCALLTYPEID}" == ""]?Set(__OMLCALLTYPEID=3))
same => n,ExecIf($["${OMLCODCLI}" == "null" || "${OMLCODCLI}" == ""]?Set(__OMLCODCLI=-1))
same => n,ExecIf($["${OMLUNIQUEID}" == ""]?Set(__OMLUNIQUEID=${CHANNEL(uniqueid)}))
; 4. LANZAMIENTO A STASIS
same => n(launchStasis),NoOp(Metadata lista. Entrando a App acd)
same => n,Stasis(${ENV(ASTERISK_APP)},call_type: 3,id_camp:${OMLCAMPID},id_customer:${OMLCODCLI},tel_customer:${OMLOUTNUM},tel_dialed:${OMLINBOUNDID},callid:${OMLUNIQUEID},channel_type: to_queue)
same => n,Hangup()

; Subrutina para enrutar llamadas a través de switches (oml_extensions_globals.conf)
; Subrutina para enrutar llamadas a través de switches (oml_extensions_globals.conf)
[sub-oml-dst-switch]
exten => s,1,Verbose(2, "Un viaje de mil millas comienza con el primer paso" - Lao Tse)
same => n,Set(OMLDEST=${ARG1})
same => n,Set(OMLOBJID=${ARG2})
same => n,Gosub(${OBJ/${ARG1}}(${OMLOBJID}))
same => n,Return(FAIL-SWITCH)

; Subrutina para implementar modulo de IVR
; Subrutina para implementar modulo de IVR
[sub-oml-module-ivr]
exten => s,1,Verbose(2, IVR module affect this channel: ${CHANNEL})
same => n,Set(OMLIVRID=${ARG1})
same => n,Gosub(sub-oml-set-chanvars,s,1(${OMLIVRID},IVR))

same => n,Set(OMLTOCOUNT=1)
same => n,Set(OMLINVCOUNT=1)
same => n,Set(XCOUNT=1)
same => n,Set(CORRECTOPT=0)

same => n(audio),Read(OMLIVRDTMF,${OMLIVRAUDIO},1,,1,${OMLIVRTIMEOUT})
same => n,GotoIf($[${ISNULL(${OMLIVRDTMF})}]?nullDTMF)

same => n(while),Set(COUNTER=1)
same => n,While($[${COUNTER} <= ${OMLIVROPTIONS}])
same => n,ExecIf($["${OMLIVRDTMF}" == "${OMLIVROPTIONDTMF-${COUNTER}}"]?Set(CORRECTOPT=1))
same => n,ExecIf($["${CORRECTOPT}" == "1"]?ExitWhile())
same => n,Set(COUNTER=${INC(COUNTER)})
same => n,EndWhile()

same => n,GotoIf($["${CORRECTOPT}" == "1"]?correctOpt)

same => n,Verbose(2, DTMF invalido para este IVR) ; retry & contador de fallos
same => n,GotoIf($[${ISNULL(${OMLIVRINVRETRY})}]?invalidDst)
same => n,Gosub(sub-oml-countdown,s,1(${XCOUNT},${OMLIVRINVRETRY}))
same => n,ExecIf($["${OMLIVRINVAUDIO}"!="NONE"]?Playback(${OMLIVRINVAUDIO}))
same => n,GotoIf($["${GOSUB_RETVAL}" == "0"]?invalidDst)
same => n,Goto(audio)

same => n(invalidDst),Gosub(sub-oml-dst-switch,s,1(${OMLIVRDEFAULTINVDST}))
same => n,Gosub(sub-oml-hangup,s,1(FAIL-IVR))

same => n(nullDTMF),Verbose(2, DTMF nulo para este IVR)
same => n,GotoIf($[${ISNULL(${OMLIVRTORETRY})}]?timeOutDst)
same => n,Gosub(sub-oml-countdown,s,1(${XCOUNT},${OMLIVRTORETRY}))
same => n,ExecIf($["${OMLIVRTOAUDIO}"!="NONE"]?Playback(${OMLIVRTOAUDIO}))
same => n,GotoIf($["${GOSUB_RETVAL}" == "0"]?timeOutDst)
same => n,Goto(audio)

same => n(timeOutDst),Gosub(sub-oml-dst-switch,s,1(${OMLIVRDEFAULTTODST}))
same => n,Gosub(sub-oml-hangup,s,1(FAIL-IVR))

same => n(correctOpt),Set(OMLOBJDST=${OMLIVROPTIONDST-${COUNTER}})
same => n,Gosub(sub-oml-dst-switch,s,1(${OMLOBJDST}))
same => n,Gosub(sub-oml-hangup,s,1(FAIL-IVR))

; Subrutinas para implementar modulo de Time Conditions
; Subrutinas para implementar modulo de Time Conditions
[sub-oml-module-time-conditions]
exten => s,1,Verbose(2, OMLTCID: ${ARG1})
same => n,Gosub(sub-oml-set-chanvars,s,1(${ARG1},TC))
same => n,Gosub(sub-oml-module-time-groups,s,1(${OMLTCTGID}))
same => n,GotoIf($["${OMLTGRESULT}" == "1"]?trueCondition:falseCondition)
same => n,Gosub(sub-oml-hangup,s,1(fallo time-conditions module))
; false destination
same => n(trueCondition),Gosub(sub-oml-dst-switch,s,1(${OMLTCTRUEDST}))
same => n,Gosub(sub-oml-hangup,s,1(fail time-conditions module))
; true destination
same => n(falseCondition),Gosub(sub-oml-dst-switch,s,1(${OMLTCFALSEDST}))
same => n,Gosub(sub-oml-hangup,s,1(fail time-conditions module))

[sub-oml-module-custom-dst]
exten => s,1,Verbose(2, Custom destination ${ARG1})
same => n,Gosub(sub-oml-set-chanvars,s,1(${ARG1},CUSTOMDST))
same => n,ExecIf($[${DIALPLAN_EXISTS(${OMLCUSTOMDSTDST})} == 1]?Goto(${OMLCUSTOMDSTDST}))
same => n,Gosub(sub-oml-dst-switch,s,1(${OMLCUSTOMDSTFAILOVER}))
same => n,Hangup()

[sub-oml-module-time-groups]
exten => s,1,Verbose(2, Time Group module affect this channel: ${CHANNEL})
same => n,Gosub(sub-oml-set-chanvars,s,1(${ARG1},TG))
; inicio While loop to check time groups
same => n(while),Set(OMLTGCOUNTER=1)
same => n,Set(__OMLTGRESULT=0)
same => n,While($[${OMLTGCOUNTER} <= ${OMLTGENTRIES}])

same => n,Set(OMLTGHOURF=${OMLTGENTRYHOURF-${OMLTGCOUNTER}})
same => n,Set(OMLTGHOURT=${OMLTGENTRYHOURT-${OMLTGCOUNTER}})
same => n,Set(OMLTGDAYF=${OMLTGENTRYDAYF-${OMLTGCOUNTER}})
same => n,Set(OMLTGDAYT=${OMLTGENTRYDAYT-${OMLTGCOUNTER}})
same => n,Set(OMLTGDAYNUMF=${OMLTGENTRYDAYNUMF-${OMLTGCOUNTER}})
same => n,Set(OMLTGDAYNUMT=${OMLTGENTRYDAYNUMT-${OMLTGCOUNTER}})
same => n,Set(OMLTGMONTHF=${OMLTGENTRYMONTHF-${OMLTGCOUNTER}})
same => n,Set(OMLTGMONTHT=${OMLTGENTRYMONTHT-${OMLTGCOUNTER}})

same => n,Set(OMLTGHOURRANGE=${OMLTGHOURF}-${OMLTGHOURT})
same => n,GotoIf($["${OMLTGHOURF}" == "${OMLTGHOURT}"]?setHourRange)

; check if the range is composed by the same value
same => n(dayRangeSet),Set(OMLTGDAYRANGE=${OMLTGDAYF}-${OMLTGDAYT})
same => n,GotoIf($["${OMLTGDAYF}" == "${OMLTGDAYT}"]?setDayRange)

same => n(dayNumRangeSet),Set(OMLTGDAYNUMRANGE=${OMLTGDAYNUMF}-${OMLTGDAYNUMT})
same => n,GotoIf($["${OMLTGDAYNUMF}" == "${OMLTGDAYNUMT}"]?setDayNumRange)

same => n(monthRangeSet),Set(OMLTGMONTHRANGE=${OMLTGMONTHF}-${OMLTGMONTHT})
same => n,GotoIf($["${OMLTGMONTHF}" == "${OMLTGMONTHT}"]?setMonthRange)

same => n(checkTime),GotoIfTime(${OMLTGHOURRANGE},${OMLTGDAYRANGE},${OMLTGDAYNUMRANGE},${OMLTGMONTHRANGE}?trueCondition)

same => n,Set(OMLTGCOUNTER=${INC(OMLTGCOUNTER)})
same => n,EndWhile()
same => n,Return(FAIL DIALPLAN)

; true destination
same => n(trueCondition),Set(__OMLTGRESULT=1)
same => n,ExitWhile()
same => n,EndWhile()
same => n,Return()

; AUX set range variables, when variables FROM TO are equal
same => n(setHourRange),Set(OMLTGDAYRANGE=${OMLTGDAYF})
same => n,Gosub(sub-oml-hangup,s,1(error de hora))

same => n(setDayRange),Set(OMLTGDAYRANGE=${OMLTGDAYF})
same => n,Goto(dayNumRangeSet)

same => n(setDayNumRange),Set(OMLTGDAYNUMRANGE=${OMLTGDAYNUMF})
same => n,Goto(monthRangeSet)

same => n(setMonthRange),Set(OMLTGMONTHRANGE=${OMLTGMONTHF})
same => n,Goto(checkTime)

; Subrutina para implementar modulo de Survey
; Subrutina para implementar modulo de Survey
[sub-oml-module-survey]
exten => s,1,Verbose(2, Welcome 2 OML Survey Module)
same => n,Set(CHANNEL(hangup_handler_push)=rip-survey,s,1)

same => n,Gosub(sub-oml-set-chanvars,s,1(${ARG1},SURVEY))
same => n,Set(OMLSURVEYQUESTION=${OMLSURVEYFIRST_QUESTION})

same => n,Playback(${OMLSURVEYSTART_AUDIO})

; comienzo bucle para traer datos de cada pregunta: ${OML_SURVEY_QUESTION}
same => n,Set(OMLINVCOUNTER=1)
same => n(getQst),Gosub(sub-oml-set-chanvars,s,1(${OMLSURVEYQUESTION},SURVEY_QUESTION))
same => n(qstAudio),Read(OMLSURVEYANS,${OMLSURVEY_QUESTIONAUDIO},1,,1,${OMLSURVEYTIME_OUT})

; busco el DTMF introducido iterando entre las respuestas posibles: ${OMLSURVEY_QUESTIONOPTIONS}
same => n,Set(XCOUNTER=1)
same => n,GotoIf($[${ISNULL(${OMLSURVEYANS})}]?incorrectAns)
same => n(answer),GotoIf($[${XCOUNTER} <= ${OMLSURVEY_QUESTIONOPTIONS}]?:incorrectAns)
same => n,GotoIf($["${OMLSURVEYANS}" == "*"]?qstAudio)
same => n,GotoIf($[${OMLSURVEYANS} == ${OMLSURVEY_QUESTIONOPTION-DTMF-${XCOUNTER}}]?correctAns)
same => n,Set(XCOUNTER=${INC(XCOUNTER)})
same => n,Goto(answer)

same => n(incorrectAns),Verbose(2, no se ingreso una respuesta correcta)
same => n,Playback(pbx-invalid)
same => n,Gosub(sub-oml-countdown,s,1(${OMLINVCOUNTER},${OMLSURVEYMAX_RETRIES}))
same => n,Set(OMLINVCOUNTER=${INC(OMLINVCOUNTER)})
same => n,ExecIf($["${GOSUB_RETVAL}" == "0"]?Hangup())
same => n,Goto(qstAudio)

same => n(correctAns),Verbose(2, Dest for answer ${OMLSURVEYANS}: ${OMLSURVEY_QUESTIONOPTION-ACTION-${XCOUNTER}})
same => n,ExecIf($["${CUT(MEMBERNAME,,1)}" != ""]?Set(IDAGENT=${CUT(MEMBERNAME,_,1)}):Set(IDAGENT=${OMLAGENTID}))
same => n,ExecIf($["${OMLAGENTTRANSFERDSTID}" != ""]?Set(IDAGENT=${OMLAGENTTRANSFERDSTID}))
same => n,ExecIf($["${OMLCALLTYPEID}" == "1" | "${OMLCALLTYPEID}" == "4"]?Set(OMLCAMPRECFILENAME=${SHARED(OMLCAMPRECFILENAME,${CHANNEL})}))
same => n,ExecIf($["${OMLCALLTYPEID}" == "2"]?Set(IDAGENT=-1))
same => n,AGI(agi://${ENV(FASTAGI)}/omni-survey-answer,${OMLCAMPID},${OMLSURVEYQUESTION},${OMLSURVEY_QUESTIONOPTION-DTMF-ID-${OMLSURVEYANS}},${STRFTIME(${EPOCH},,%C%y-%m-%d %H:%M:%S)},${OMLUNIQUEID},${OMLOUTNUM},${OMLCODCLI},${IDAGENT},${OMLCAMPRECFILENAME})
same => n,GotoIf($["${OMLSURVEY_QUESTIONOPTION-ACTION-${XCOUNTER}}" == "0"]?endSurvey)
same => n,GotoIf($["${OMLSURVEY_QUESTIONOPTION-ACTION-${XCOUNTER}}" == "1"]?nextQ)
same => n,GotoIf($["${OMLSURVEY_QUESTIONOPTION-ACTION-${XCOUNTER}}" == "2"]?goNode)

same => n(goNode),Set(__OMLSURVEYSTATUS=COMPLETED)
same => n,Gosub(sub-oml-dst-switch,s,1(${OMLSURVEY_QUESTIONOPTION-NEXT-${XCOUNTER}}))
same => n,Playback(${OMLSURVEYEND_AUDIO})
same => n,Gosub(sub-oml-dst-switch,s,1(5,1))

same => n(endSurvey),Set(__OMLSURVEYSTATUS=COMPLETED)
same => n,Playback(${OMLSURVEYEND_AUDIO})
same => n,Gosub(sub-oml-dst-switch,s,1(5,1))

same => n(nextQ),Set(OMLSURVEYQUESTION=${OMLSURVEY_QUESTIONOPTION-NEXT-${XCOUNTER}})
same => n,Goto(getQst)

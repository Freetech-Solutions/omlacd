[agent-transport]
type=transport
async_operations=1
bind=0.0.0.0:5160
protocol=udp
allow_reload=yes
symmetric_transport=yes

[trunk-transport]
type=transport
async_operations=1
bind=0.0.0.0:5161
protocol=udp
allow_reload=yes
symmetric_transport=yes

[trunk-nat-transport]
type=transport
async_operations=1
bind=0.0.0.0:5162
protocol=udp
allow_reload=yes
symmetric_transport=yes
external_media_address=extern_ip_nat
external_signaling_address=extern_ip_nat

[trunk-nat-docker-transport]
type=transport
async_operations=1
bind=0.0.0.0:5163
protocol=udp
allow_reload=yes
symmetric_transport=yes
external_media_address=docker_engine_ip
external_signaling_address=docker_engine_ip

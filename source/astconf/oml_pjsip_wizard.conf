; Trunk for WebRCT Agent
[webrtc-trunk]
type=wizard
transport=agent-transport
accepts_registrations=no
sends_registrations=no
accepts_auth=no
sends_auth=no
remote_hosts=kamailio-webrtc:10060
aor/contact=sip:kamailio-webrtc:10060
aor/qualify_frequency=0
endpoint/context=from-kamailio
endpoint/disallow=all
endpoint/allow=alaw,ulaw,opus
endpoint/direct_media=no
endpoint/rewrite_contact=yes
endpoint/rtp_symmetric=yes
endpoint/force_rport=yes

; PSTN trunks behind Kamailio: no OPTIONS qualify (marks AOR Unreachable through
; outbound_proxy) and no REGISTER unless the ITSP requires it (override in
; retrieve_conf/oml_pjsip_trunks.conf: sends_registrations=yes).
[sip-trunks](!)
type=wizard
transport=trunk-transport
accepts_registrations=no
accepts_auth=no
sends_registrations=no
sends_auth=yes
aor/qualify_frequency=0
endpoint/direct_media=no
endpoint/set_var=PJSIP_HEADER(add,OMniLeadsOutbound)=yes
endpoint/set_var=PJSIP_TRANSFER_HANDLING()=ari-only
endpoint/rtp_symmetric=yes
endpoint/force_rport=yes
endpoint/rewrite_contact=yes
endpoint/timers=yes
endpoint/dtmf_mode=rfc4733
endpoint/context=from-pstn
endpoint/allow=alaw,ulaw

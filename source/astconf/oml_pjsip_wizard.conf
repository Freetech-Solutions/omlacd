[agents](!)
type=wizard
transport=agent-transport
accepts_registrations=yes
sends_registrations=no
accepts_auth=no
sends_auth=no
max_initial_qualify_time=10
endpoint/disallow=all
endpoint/allow=opus
endpoint/direct_media=no
endpoint/force_rport=no
endpoint/disable_direct_media_on_nat=yes
endpoint/direct_media_method=invite
endpoint/ice_support=no
endpoint/moh_suggest=default
endpoint/send_rpid=yes
endpoint/rewrite_contact=yes
endpoint/send_pai=yes
endpoint/allow_transfer=yes
endpoint/trust_id_inbound=yes
endpoint/device_state_busy_at=1
endpoint/trust_id_outbound=yes
endpoint/send_diversion=yes
endpoint/rtp_symmetric=yes
endpoint/rtp_keepalive=25
endpoint/rtp_timeout=30
endpoint/rtp_timeout_hold=360
aor/authenticate_qualify=no
aor/max_contacts=1
aor/remove_existing=yes
aor/minimum_expiration=30
aor/qualify_2xx_only=yes
aor/qualify_frequency=5
aor/qualify_timeout=2.0

[omnidialer]
type=wizard
transport=dialer-transport
accepts_registrations=no
sends_auth=no
sends_registrations=no
accepts_auth=no
direct_media=yes
remote_hosts=dialer-asterisk:10061
endpoint/rtp_symmetric=yes
endpoint/force_rport=yes
endpoint/rewrite_contact=yes
endpoint/timers=yes
endpoint/allow=alaw
endpoint/dtmf_mode=rfc4733
endpoint/context=from-dialer
endpoint/identify_by=ip
identify/match=dialer-asterisk
aor/authenticate_qualify=no
aor/max_contacts=1
aor/remove_existing=yes
aor/minimum_expiration=30
;aor/qualify_2xx_only=yes
;aor/qualify_frequency=15
;aor/qualify_timeout=3.0

#include retrieve_conf/oml_pjsip_agents.conf
#include retrieve_conf/oml_pjsip_trunks.conf

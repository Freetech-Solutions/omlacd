[global]
type=global
max_forwards=20
keep_alive_interval=30
contact_expiration_check_interval=30
disable_multi_domain=no
max_initial_qualify_time=45
unidentified_request_period=20
unidentified_request_count=10
unidentified_request_prune_interval=30
user_agent=omnileads
regcontext=oml_register
default_outbound_endpoint=default
default_voicemail_extension=default
debug=no
endpoint_identifier_order=ip,username
default_from_user=omnileads
default_realm=asterisk
ignore_uri_user_options=yes

[system]
type=system
; T1=500ms (RFC 3261); Timer B kept at 64s for slow PSTN (64*T1 would be 32s)
timer_t1=500
timer_b=64000
compact_headers=no
threadpool_initial_size=10
threadpool_auto_increment=5
threadpool_idle_timeout=60
threadpool_max_size=100
taskpool_initial_size=10
taskpool_auto_increment=5
taskpool_idle_timeout=60
taskpool_max_size=100
taskpool_minimum_size=4
disable_tcp_switch=yes
follow_early_media_fork=yes
accept_multiple_sdp_answers=no

; ### PJSIP Agent Transports (Kamailio WebRTC)
[agent-transport]
type=transport
async_operations=1
bind=0.0.0.0:5160
protocol=udp
allow_reload=yes
symmetric_transport=yes

; ### PJSIP Trunk Transports (Kamailio VoIP)
[trunk-transport]
type=transport
async_operations=2
bind=0.0.0.0:5070
protocol=udp
allow_reload=yes
symmetric_transport=yes

[trunk-transport-tcp]
type=transport
async_operations=2
bind=0.0.0.0:5070
protocol=tcp
allow_reload=yes
symmetric_transport=yes

[trunk-transport-tls]
type=transport
async_operations=2
bind=0.0.0.0:5071
protocol=tls
allow_reload=yes
symmetric_transport=yes

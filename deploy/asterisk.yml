---

- name: Asterisk installation and configuration
  hosts: prodenv-aio
  vars:
    cron_location: /var/spool/cron/omnileads
    packages_url: https://fts-public-packages.s3.amazonaws.com
    oml_utilities_repo: https://gitlab.com/omnileads/omlutilities.git
    asterisk_package: "{{ packages_url }}/asterisk/asterisk-{{ asterisk_version }}.x86_64.rpm"
    asterisk_location: /opt/omnileads/asterisk
    postgresql_version: 11

  tasks:

  # Se setea el timezone
  - name: Set timezone of server
    timezone: name={{ TZ }}

  # Obtengo IP publica del nodo
  - name: Get public IP address of node
    shell: curl http://ipinfo.io/ip
    register: publicip
    when: extern_ip == "auto" and asterisk_out is defined

  # Valido si lo que devolvió la tarea anterior es una IP
  - name: Validate IP public obtained
    shell: if [[ {{ publicip.stdout }} =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 0; else echo 1; fi
    args:
      executable: /bin/bash
    register: ip_val
    failed_when: false
    when: extern_ip == "auto" and asterisk_out is defined
    tags: always

  # Si no es una IP tiro este mensaje de error
  - fail:
      msg: "The public IP obtained is wrong, check in shell if you obtain a public IP with this command 'curl http://ipinfo.io/ip', after that please run the script again"
    when: ip_val is not skipped and ip_val.stdout != '0'
    tags: always

  - name: Setting public_ip variable
    set_fact: public_ip="{{ publicip.stdout }}"
    when: extern_ip == "auto" and asterisk_out is defined

  - name: Set of environments variables
    copy:
      dest: "/etc/profile.d/omnileads_envars.sh"
      content: |
        ASTERISK_LOCATION={{ asterisk_location }}
        MONITORFORMAT=mp3
        CALLREC_DEVICE={{ callrec_device }}
        AMI_USER={{ ami_user }}
        AMI_PASSWORD={{ ami_password }}
        {% if extern_ip == "auto" %}
        EXTERN_IP={{ public_ip }}
        {% else %}
        EXTERN_IP={{ extern_ip }}
        {% endif %}
        OMNILEADS_HOSTNAME={{ omnileads_hostname }}
        REDIS_HOSTNAME={{ redis_hostname }}
        PGHOST={{ postgres_hostname }}
        PGPORT={{ postgres_port }}
        PGUSER={{ postgres_user }}
        PGDATABASE={{ postgres_database }}
        PGPASSWORD={{ postgres_password }}
        {% if s3_bucket_name is defined %}
        S3_STORAGE_ENABLED=true
        S3_BUCKET_NAME={{ s3_bucket_name }}
        {% if callrec_device != "s3-aws" %}
        AWS_ACCESS_KEY_ID={{ s3_access_key }}
        AWS_SECRET_ACCESS_KEY={{ s3_secret_key }}
        S3_ENDPOINT={{ s3url }}
        AWS_DEFAULT_REGION=us-east-1
        {% endif %}
        {% endif %}

        export ASTERISK_LOCATION  MONITORFORMAT CALLREC_DEVICE AMI_USER AMI_PASSWORD EXTERN_IP REDIS_HOSTNAME RETHINKDB_HOSTNAME PGHOST PGPORT PGDATABASE PGUSER  PGPASSWORD OMNILEADS_HOSTNAME {% if callrec_device != "local" %} S3_STORAGE_ENABLED S3_BUCKET_NAME {% if callrec_device != "s3-aws" %} S3_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY  AWS_DEFAULT_REGION {% endif %} {% endif %} 
    when: asterisk_out is defined

  - name: Remove All postgresql packages
    command: yum remove -y postgresql11*
    retries: 3
    delay: 3
    when: asterisk_out is defined

  - name: Install postgresql {{ postgresql_version }} packages (from s3 source)
    #yum: name={{ packages_url }}/postgresql/postgresql{{ postgresql_version}}{{ item }}.rpm state=latest update_cache=yes
    command: yum install -y {{ packages_url }}/postgresql/postgresql{{ postgresql_version}}{{ item }}.rpm
    with_items:
      - -libs.x86_64
      - -odbc.x86_64
    retries: 3
    delay: 3
    register: s3_download
    until: s3_download is success
    when: asterisk_out is defined

  # Chequeo si la version de asterisk instalada es {{ asterisk_version }}
  - name: Check if asterisk OMniLeads package {{ asterisk_version }} is installed
    shell: yum list installed |grep asterisk | awk -F " " '{print $2}' |awk -F "-" '{print $1}'
    register: asterisk_installed
    changed_when: false
    tags: postinstall

  # Chequeo si existen ya los archivos custom y override dialplan, para no pisarlos
  - name: Check if custom and override files for dialplan exists
    shell: "if [ $(ls -l {{ asterisk_location }}/etc/asterisk/oml_extensions_*_override.conf 2> /dev/null | wc -l) -gt 0 ] && [ $(ls -l {{ asterisk_location }}/etc/asterisk/oml_extensions_*_custom.conf 2> /dev/null | wc -l) -gt 0 ];then exit 1;else exit 0;fi"
    changed_when: false
    failed_when: false
    register: ast_custom_exists
    tags: always

  # Se imprime que el asterisk OMniLeads configuration no esta instalado si la version actual es inferior a la requerida
  - debug: msg="Asterisk {{ asterisk_version }} is not installed, proceeding to install"
    when: asterisk_installed.stdout != asterisk_version
    tags: postinstall

  # Por lo contrario se imprime que ya está instalada la version mas actual
  - debug: msg="Asterisk is already installed in version {{ asterisk_version }}, skipping installation steps"
    when: asterisk_installed.stdout == asterisk_version
    tags: postinstall

  # Esta tarea es para eliminar paquete viejo
  - name: Delete old asterisk OMniLeads package
    #yum: name=omnileads-asterisk state=absent
    command: yum remove -y asterisk
    tags: postinstall
    when: asterisk_installed.stdout != asterisk_version

  # Se instala el paquete asterisk
  - name: Install asterisk-{{ asterisk_version }} package (from s3 source)
    command: yum install -y {{ asterisk_package }}
    tags: postinstall
    when: asterisk_installed.stdout != asterisk_version
    register: s3_download
    failed_when:
      - "s3_download.rc != 0 or 'scriptlet failure' in s3_download.stderr"

  # Creo archivos custom & override en fresh-install
  - name: Create _custom & _override astconf files
    when: ast_custom_exists.rc != 1
    file:
      path: "{{ asterisk_location }}/etc/asterisk/{{ item }}"
      state: touch
      mode: 0664
      owner: omnileads
    with_items:
    - oml_amd_custom.conf
    - oml_dahdi_custom.conf
    - oml_extensions_bridgecall_custom.conf
    - oml_extensions_commonsub_custom.conf
    - oml_extensions_custom.conf
    - oml_extensions_globals_custom.conf
    - oml_extensions_inr_custom.conf
    - oml_extensions_ivr_custom.conf
    - oml_extensions_modules_custom.conf
    - oml_extensions_outr_custom.conf
    - oml_extensions_postcall_custom.conf
    - oml_extensions_precall_custom.conf
    - oml_extensions_tc_custom.conf
    - oml_func_odbc_custom.conf
    - oml_http_custom.conf
    - oml_manager_custom.conf
    - oml_pjsip_custom.conf
    - oml_pjsip_wizard_custom.conf
    - oml_queues_custom.conf
    - oml_res_odbc_custom.conf
    - oml_sip_general_custom.conf
    - oml_sip_registrations_custom.conf
    - oml_sip_trunks_custom.conf
    - oml_amd_override.conf
    - oml_dahdi_override.conf
    - oml_extensions_override.conf
    - oml_extensions_bridgecall_override.conf
    - oml_extensions_commonsub_override.conf
    - oml_extensions_globals_override.conf
    - oml_extensions_modules_override.conf
    - oml_extensions_outr_override.conf
    - oml_extensions_override.conf
    - oml_extensions_postcall_override.conf
    - oml_extensions_precall_override.conf
    - oml_func_odbc_override.conf
    - oml_http_override.conf
    - oml_manager_override.conf
    - oml_pjsip_override.conf
    - oml_pjsip_wizard_override.conf
    - oml_queues_override.conf
    - oml_res_odbc_override.conf
    - oml_sip_general_override.conf
    - oml_sip_registrations_override.conf
    - oml_sip_trunks_override.conf
    - oml_voicemail_custom.conf
    - oml_voicemail_override.conf
    when: (backup_file_name is not defined) or (asterisk_out is not defined)

# Create backup folder
  - name: Create backup folder
    file:
      path: /opt/omnileads/backup
      state: directory
      owner: omnileads
      group: omnileads
      mode: 0764
    when:
      - asterisk_out is defined

# Download backup-restore script
  - name: Download backup-restore script
    ansible.builtin.git:
      repo: '{{ oml_utilities_repo }}'
      dest: /opt/omnileads/utils
      version: main
    when:
      - asterisk_out is defined

# Restore backup in case of IaC deploy
  - name: Restore backup when use infrasctructure as code - 1/2
    vars:
        ansible_python_interpreter: /usr/bin/python3
    aws_s3:
        s3_url: "{{ s3url }}"
        aws_secret_key: "{{ s3_secret_key }}"
        aws_access_key: "{{ s3_access_key }}"
        bucket: "{{ s3_bucket_name }}"
        object: "omlacd-backup/{{ backup_file_name }}.tar.gz"
        dest: "/opt/omnileads/backup/{{ backup_file_name }}.tar.gz"
        mode: get
    delegate_to: localhost
    register: backup_s3_download
    until: backup_s3_download
    when:
      - asterisk_out is defined
      - backup_file_name is defined
      - auto_restore == "true"
      - ansible_distribution != "Amazon"

  - name: Restore backup when use infrasctructure as code - 1/2
    vars:
        ansible_python_interpreter: /usr/bin/python3
    aws_s3:
        bucket: "{{ s3_bucket_name }}"
        object: "omlacd-backup/{{ backup_file_name }}.tar.gz"
        dest: "/opt/omnileads/backup/{{ backup_file_name }}.tar.gz"
        mode: get
    delegate_to: localhost
    register: backup_s3_download
    until: backup_s3_download
    when:
      - asterisk_out is defined
      - backup_file_name is defined
      - auto_restore == "true"
      - ansible_distribution == "Amazon"

  - name: Restore backup when use infrasctructure as code - 2/2
    command: bash -x /opt/omnileads/utils/backup-restore.sh --restore={{ backup_file_name }}.tar.gz --asterisk
    until: backup_s3_download
    when:
      - asterisk_out is defined
      - backup_file_name is defined
      - auto_restore == "true"

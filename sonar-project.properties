# Unique identifier of the project in SonarQube
sonar.projectKey=omnileads-acd

# Name of the project
sonar.projectName=OMniLeads ACD

# Path to the source directories
sonar.sources=.

# Exclude configs, tests, and build artifacts from source analysis
sonar.exclusions=**/tests_unit/**, **/astconf/**, **/odbc/**, **/build/**, **/docs/**, **/__pycache__/**, **/.pytest_cache/**, **/htmlcov/**, **/venv/**

# Path to test files
sonar.tests=.
sonar.test.inclusions=**/tests_unit/**, test_*.py

# Encoding of the source files
sonar.sourceEncoding=UTF-8
